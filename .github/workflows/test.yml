name: Lint & Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the project
        run: uv sync --locked --no-python-downloads

      - name: Run ruff
        id: ruff
        continue-on-error: true # Allow other tasks to continue if ruff fails
        run: uv run ruff check

      - name: Run ty
        id: ty
        continue-on-error: true # Allow other tasks to continue if ty fails
        run: uv run ty check

      - name: Run Ansible-Lint
        id: ansible_lint
        continue-on-error: true # Allow uploading SARIF report if ansible-lint fails
        run: uv run ansible-lint --offline --sarif-file ansible-lint.sarif.json

      - name: Upload Ansible-Lint SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ansible-lint.sarif.json
          category: ansible-lint

      - name: Fail job if any lint failed
        if: steps.ruff.outcome == 'failure' || steps.ty.outcome == 'failure' || steps.ansible_lint.outcome == 'failure'
        run: |
          echo "::error::One or more linters failed"
          exit 1
