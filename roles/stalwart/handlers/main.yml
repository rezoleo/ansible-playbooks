---
- name: Restart stalwart
  ansible.builtin.systemd_service:
    name: stalwart
    state: restarted
    daemon_reload: true
  become: true

- name: Restart stalwart-group-sent-hook
  ansible.builtin.systemd_service:
    name: stalwart-group-sent-hook
    state: restarted
    daemon_reload: true
  become: true
