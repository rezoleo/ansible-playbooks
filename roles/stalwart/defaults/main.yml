---
# Parameters. The commented ones must be set per host (host_vars), the others have a default.

# Hostname announced by the server (must be covered by the certificate)
# stalwart_hostname: mail.example.org

# Domains handled by the server, the first one is the default domain (and the one of the internal accounts)
# stalwart_domains:
#   - example.org

# DKIM selectors, the keys come from Vault (stalwart_vault_path) and are shared by all the domains
stalwart_dkim_selectors:
  rsa: rsa-2026
  ed25519: ed25519-2026

# Mails (blobs) stay on the local disk
stalwart_blob_path: "{{ stalwart_data_path }}/blobs"

# PostgreSQL holds everything but the mails, the password comes from Vault
# stalwart_db_host: pg.example.org
stalwart_db_port: 5432
stalwart_db_name: stalwart
stalwart_db_user: stalwart
stalwart_db_tls: false

# Vault: <stalwart_database_vault_path>/<db name>@<db host> (key password), stalwart_vault_path (DKIM keys, API key)
stalwart_database_vault_path: databases
stalwart_vault_path: services/stalwart

# Source of the HTTP port (webadmin, webmail, JMAP): the reverse proxy
# stalwart_http_source: 10.0.0.1/32

# Accounts given the administrator role, their domain must be in stalwart_domains
stalwart_admins: []

# Aliases and mailing lists are both Stalwart mailing lists: <name>@<domain> goes to every recipient
# Only these lists exist, a list created in the web UI is deleted by the next deployment
stalwart_mailing_lists: []
#  - name: contact
#    domain: example.org
#    description: Contact
#    recipients:
#      - someone@example.org

# Shared mailboxes: members see <name>@<domain> as a shared folder and can send as it (and as its aliases).
# Memberships are reconciled on every run: whoever is not listed in members loses access. Group names must be unique.
stalwart_groups: []
#  - name: postmaster # Required by RFC 5321 on every domain, it also gets the mail of root on the servers
#    domain: example.org
#    description: Postmaster
#    aliases:
#      - postmaster@lists.example.org
#    members:
#      - someone@example.org

# Servers and appliances (devices Ansible does not manage) send mail through stalwart_relay_account, each one as
# <name>@<stalwart_relay_domain> (an alias) with its own app password, only valid from its IP and kept in Vault under
# that address (roles/stalwart_app_password). Every inventory host outside [mail] gets one (roles/mail_relay), appliances are listed here.
# Must be in stalwart_domains. No default: roles/mail_relay reads it from the other servers through hostvars,
# which only sees the inventory (host_vars), not the defaults of this role
# stalwart_relay_domain: servers.example.org
stalwart_relay_appliances: []
#  - { name: truenas, ip: 10.0.0.2 }

# Services that send as their own address, for clients without OAuth: each one gets an internal
# account <address> (no SSO) with an app password only valid from its IP, kept in Vault under its address.
# The local part must not be a username in the SSO: that user would log into the service's account.
# Removing a service from the list does not delete its account.
stalwart_services: []
#  - { address: nextcloud@example.org, ip: 10.0.0.3, description: Nextcloud }

# Authentication is delegated to an OIDC provider
# stalwart_oidc_issuer: https://sso.example.org # Must match the "issuer" of the discovery document exactly
# Claim holding the login name. Without an "@", stalwart_oidc_username_domain is appended.
stalwart_oidc_claim_username: preferred_username
stalwart_oidc_username_domain: "{{ stalwart_domains[0] }}"
stalwart_oidc_claim_name: name
# Accepted audiences of the access tokens: the project ID and the web UI client ID
# stalwart_oidc_accepted_audiences:
#   - "123456789"
# Client ID of the web UI application (public client, PKCE).
# Redirect URIs: https://<webmail>/{admin,account}/oauth/callback
# stalwart_oidc_web_client_id: "123456789"
