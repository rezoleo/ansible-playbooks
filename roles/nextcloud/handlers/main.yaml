- name: Restart CODE
  ansible.builtin.command:
    cmd: podman-compose up -d
    chdir: /home/podman/code
  become: true
  become_user: podman
  changed_when: true

- name: Restart Nextcloud
  ansible.builtin.command:
    cmd: podman-compose up -d
    chdir: /home/podman/nextcloud
  become: true
  become_user: podman
  changed_when: true
