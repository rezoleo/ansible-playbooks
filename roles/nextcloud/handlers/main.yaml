- name: Restart CODE
  ansible.builtin.command:
    cmd: podman-compose up -d --force-recreate
    chdir: /home/podman/code
  become: true
  become_user: podman
  changed_when: true

# When the compose file is changed we recreate the whole stack
- name: Restart Nextcloud
  ansible.builtin.command:
    cmd: podman-compose up -d --force-recreate
    chdir: /home/podman/nextcloud
  become: true
  become_user: podman
  changed_when: true

# When the env file is changed only Nextcloud should be affected
- name: Restart Nextcloud service
  ansible.builtin.command:
    cmd: podman-compose up -d --force-recreate nextcloud
    chdir: /home/podman/nextcloud
  become: true
  become_user: podman
  changed_when: true
  when: not nextcloud_compose.changed
