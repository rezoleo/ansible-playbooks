- name: Retrieve Nextcloud secrets from Vault
  community.hashi_vault.vault_kv2_get:
    path: "{{ nextcloud_vault_secret_path }}"
  register:
    nextcloud_admin_username: _task.result.secret.admin_username
    nextcloud_admin_password: _task.result.secret.admin_password
    nextcloud_smtp_password: _task.result.secret.smtp_password
    nextcloud_smtp_address: _task.result.secret.smtp_address
  run_once: true
  delegate_to: localhost

- name: Retrieve S3 secrets from Vault
  community.hashi_vault.vault_kv2_get:
    path: "{{ nextcloud_vault_garage_path }}"
  register:
    nextcloud_object_key: _task.result.secret.id
    nextcloud_object_secret: _task.result.secret.secret
  run_once: true
  delegate_to: localhost

- name: Retrieve database secrets from Vault
  community.hashi_vault.vault_kv2_get:
    path: "{{ nextcloud_vault_db_path }}"
  register:
    nextcloud_db_password: _task.result.secret.nextcloud
  run_once: true
  delegate_to: localhost

- name: Create nextcloud directory
  ansible.builtin.file:
    path: /home/podman/nextcloud
    state: directory
    owner: podman
    group: podman
    mode: "0755"
  become: true

- name: Create CODE directory
  ansible.builtin.file:
    path: /home/podman/code
    state: directory
    owner: podman
    group: podman
    mode: "0755"
  become: true

- name: Copy compose file for CODE
  ansible.builtin.copy:
    src: code/compose.yml
    dest: /home/podman/code/compose.yml
    owner: podman
    group: podman
    mode: "0644"
  become: true
  notify: Restart CODE

- name: Copy compose file for Nextcloud
  ansible.builtin.copy:
    src: nextcloud/compose.yml
    dest: /home/podman/nextcloud/compose.yml
    owner: podman
    group: podman
    mode: "0644"
  become: true
  notify: Restart Nextcloud

- name: Copy and fill .env file for Nextcloud
  ansible.builtin.template:
    src: nextcloud.env.j2
    dest: /home/podman/nextcloud/nextcloud.env
    owner: podman
    group: podman
    mode: "0600"
  become: true
  notify: Restart Nextcloud

- name: Copy and fill .env file for CODE
  ansible.builtin.template:
    src: code.env.j2
    dest: /home/podman/code/code.env
    owner: podman
    group: podman
    mode: "0600"
  become: true
  notify: Restart CODE

- name: Add firewall rules for Nextcloud
  ansible.builtin.import_role:
    name: firewall
    tasks_from: create_rule.yml
  vars:
    firewall_rules:
      050-equestria:
        - rule_name: "Allow traffic from Equestria to port 3000"
          chain: INPUT
          protocol: tcp
          source: "{{ reverse_proxy_address }}"
          destination_port: 3000
          target: ACCEPT
        - rule_name: "Allow traffic from Equestria to port 3001"
          chain: INPUT
          protocol: tcp
          source: "{{ reverse_proxy_address }}"
          destination_port: 3001
          target: ACCEPT
