---
- name: Retrieve Nextcloud secrets from Vault
  community.hashi_vault.vault_kv2_get:
    path: "{{ nextcloud_vault_secret_path }}"
  register:
    nextcloud_admin_username: _task.result.secret.admin_username
    nextcloud_admin_password: _task.result.secret.admin_password
    nextcloud_smtp_password: _task.result.secret.smtp_password
    nextcloud_smtp_mail_address: _task.result.secret.smtp_mail_address
  run_once: true
  delegate_to: localhost

- name: Retrieve S3 secrets from Vault
  community.hashi_vault.vault_kv2_get:
    path: "{{ nextcloud_vault_garage_path }}"
  register:
    nextcloud_object_key: _task.result.secret.id
    nextcloud_object_secret: _task.result.secret.secret
  run_once: true
  delegate_to: localhost

- name: Retrieve database secrets from Vault
  community.hashi_vault.vault_kv2_get:
    path: "{{ nextcloud_vault_db_path }}"
  register:
    nextcloud_db_password: _task.result.secret.nextcloud
  run_once: true
  delegate_to: localhost

- name: Install and configure Nextcloud
  ansible.builtin.include_role:
    name: nextcloud.admin.install_nextcloud
  vars:
    php_install_external_repos: "{{ nextcloud_php_install_external_repos }}"
    php_ver: "{{ nextcloud_php_ver }}"
    nextcloud_admin_name: "{{ nextcloud_admin_username }}"
    nextcloud_admin_pwd: "{{ nextcloud_admin_password }}"
    nextcloud_db_pwd: "{{ nextcloud_db_password }}"
    nextcloud_config_settings:
      - { name: "overwriteprotocol", value: "https" }
      - { name: "overwritehost", value: "{{ nextcloud_host }}" }
      - { name: "overwrite.cli.url", value: "https://{{ nextcloud_host }}" }
      - { name: "memcache.local", value: '\OC\Memcache\APCu' }

- name: Configure Nextcloud SMTP settings
  ansible.builtin.template:
    src: smtp.config.php.j2
    dest: "{{ nextcloud_webroot }}/config/smtp.config.php"
    owner: www-data
    group: www-data
    mode: "0640"
  become: true

- name: Configure Garage S3 primary object storage
  ansible.builtin.template:
    src: s3.config.php.j2
    dest: "{{ nextcloud_webroot }}/config/s3.config.php"
    owner: www-data
    group: www-data
    mode: "0640"
  become: true

- name: Add firewall rules for Nextcloud
  ansible.builtin.import_role:
    name: firewall
    tasks_from: create_rule.yml
  vars:
    firewall_rules:
      050-equestria:
        - rule_name: "Allow traffic from Equestria to port 80"
          chain: INPUT
          protocol: tcp
          source: "{{ reverse_proxy_address }}"
          destination_port: 80
          target: ACCEPT
