---
# Adapted for Debian (Apache2 + reverse-proxy HTTP) from:
# https://github.com/nextcloud/ansible-collection-nextcloud-admin/blob/main/roles/install_nextcloud/tasks/websrv_install.yml
# https://github.com/nextcloud/ansible-collection-nextcloud-admin/blob/main/roles/install_nextcloud/tasks/http_apache.yml

- name: Install Apache2 and mod_php packages
  ansible.builtin.apt:
    name:
      - apache2
      - "libapache2-mod-php{{ nextcloud_php_ver }}"
    state: present
  become: true
  notify: Start http

- name: Enable APC for PHP CLI
  ansible.builtin.lineinfile:
    dest: "{{ nextcloud_php_dir }}/cli/php.ini"
    regexp: '^;?\s*apc\.enable_cli\s*='
    line: "apc.enable_cli = 1"
    insertbefore: "^; End:$"
    state: present
  become: true

- name: Enable PHP OPcache for php.ini
  ansible.builtin.lineinfile:
    dest: "{{ nextcloud_php_dir }}/apache2/php.ini"
    state: present
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^;?\s*opcache\.enable\s*=', line: "opcache.enable=1" }
    - { regexp: '^;?\s*opcache\.enable_cli\s*=', line: "opcache.enable_cli=1" }
    - { regexp: '^;?\s*opcache\.interned_strings_buffer\s*=', line: "opcache.interned_strings_buffer=16" }
    - { regexp: '^;?\s*opcache\.max_accelerated_files\s*=', line: "opcache.max_accelerated_files=10000" }
    - { regexp: '^;?\s*opcache\.memory_consumption\s*=', line: "opcache.memory_consumption=128" }
    - { regexp: '^;?\s*opcache\.save_comments\s*=', line: "opcache.save_comments=1" }
    - { regexp: '^;?\s*opcache\.revalidate_freq\s*=', line: "opcache.revalidate_freq=1" }
    - { regexp: '^;?\s*memory_limit\s*=', line: "memory_limit={{ nextcloud_php_memory_limit }}" }
    - { regexp: '^;?\s*upload_max_filesize\s*=', line: "upload_max_filesize={{ nextcloud_max_upload_size }}" }
    - { regexp: '^;?\s*post_max_size\s*=', line: "post_max_size={{ nextcloud_max_upload_size }}" }
  become: true
  notify: Reload http

- name: Enable required Apache2 modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - rewrite
    - headers
    - env
    - dir
    - mime
    - setenvif
  become: true
  notify: Restart http

- name: Generate Nextcloud configuration for Apache
  ansible.builtin.template:
    dest: "/etc/apache2/sites-available/nc_{{ nextcloud_instance_name }}.conf"
    src: apache2_nc.j2
    owner: root
    group: root
    mode: "0640"
  become: true
  notify: Reload http

- name: Enable Nextcloud site in Apache conf
  ansible.builtin.file:
    path: "/etc/apache2/sites-enabled/nc_{{ nextcloud_instance_name }}.conf"
    src: "/etc/apache2/sites-available/nc_{{ nextcloud_instance_name }}.conf"
    state: link
  become: true
  notify: Reload http

- name: Disable Apache default site
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  become: true
  notify: Reload http
