services:
  nextcloud:
    container_name: nextcloud
    image: docker.io/library/nextcloud:35.0.1-apache@sha256:a588aa5353703b44106a6129adaaf7bf22521b7a4754f9f529b3228d6aa390c5
    restart: always
    ports:
      - 3000:80
    volumes:
      - ./nextcloud:/var/www/html
    networks:
      - nextcloud_net
    env_file: nextcloud.env
    mem_limit: 8G
    cpus: 4
    healthcheck:
      test: curl -sSf 'http://localhost/status.php' | grep '"installed":true' | grep '"maintenance":false' | grep '"needsDbUpgrade":false' || exit 1
      interval: 60s
      start_period: 120s
      timeout: 5s
      retries: 10
    depends_on:
      broker:
        condition: service_healthy

  cron:
    container_name: nextcloud-cron
    image: docker.io/library/nextcloud:35.0.1-apache@sha256:a588aa5353703b44106a6129adaaf7bf22521b7a4754f9f529b3228d6aa390c5
    restart: always
    entrypoint: /cron.sh
    volumes:
      - ./nextcloud:/var/www/html
    env_file: nextcloud.env
    environment:
      PHP_MEMORY_LIMIT: 2G
    depends_on:
      nextcloud:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:18.7@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    restart: always
    networks:
      - nextcloud_net
    volumes:
      - ./nextcloud-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'"]
      interval: 10s
      timeout: 3s
      retries: 3
    env_file: nextcloud.env

  broker:
    image: docker.io/library/redis:8@sha256:a7efd4ed5037dcfe1543c0e50b9f06293d3e88827005544bf37f381eea5f01cf
    restart: always
    networks:
      - nextcloud_net
    mem_limit: 1G
    cpus: 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: "5s"

networks:
  nextcloud_net:
    driver: bridge
    x-podman:
      dns_enabled: true
