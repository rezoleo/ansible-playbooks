---
- name: Check the variables required on every host
  ansible.builtin.assert:
    that:
      - vault_agent_vault_addr is defined
      - vault_agent_pki_mount is defined
    fail_msg: Check the README of the role.
    quiet: true
  tags:
    - vault_agent
    - configuration

- name: Certificates will be deployed?
  ansible.builtin.set_fact:
    vault_agent_cert_deployment: "{{ vault_agent_certs | length > 0 }}"
  become: false
  delegate_to: localhost

- name: Check the variables required to deploy a certificate
  ansible.builtin.assert:
    that:
      - vault_agent_domain is defined
      - (not (vault_agent_wildcard_enabled | bool)) or (vault_agent_wildcard_kv_path is defined)
    fail_msg: Check the README of the role.
    quiet: true
  when: vault_agent_cert_deployment
  tags:
    - vault_agent
    - configuration

- name: Install Vault from the HashiCorp repository
  ansible.builtin.import_tasks: package.yml
  when: vault_agent_cert_deployment
  tags:
    - vault_agent
    - package

- name: Deploy the CA
  ansible.builtin.import_tasks: ca.yml
  become: true
  tags:
    - vault_agent
    - ca

- name: Create groups, directories and hook directories
  ansible.builtin.include_tasks:
    file: layout.yml
    apply:
      tags:
        - vault_agent
        - configuration
  when: vault_agent_cert_deployment

- name: Create the Vault identity of this host
  ansible.builtin.include_tasks:
    file: identity.yml
    apply:
      tags:
        - vault_agent
        - credentials
  when: vault_agent_cert_deployment

- name: Configure and start the agent
  ansible.builtin.include_tasks:
    file: service.yml
    apply:
      tags:
        - vault_agent
        - service
  when: vault_agent_cert_deployment
