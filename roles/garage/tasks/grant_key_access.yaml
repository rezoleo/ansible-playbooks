- name: Get bucket current details
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ garage_admin_api_port }}/v2/GetBucketInfo?globalAlias={{ bucket.name }}"
    return_content: true
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
  register: garage_bucket_details

- name: Allow key access to bucket
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ garage_admin_api_port }}/v2/AllowBucketKey"
    return_content: true
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
      Content-Type: application/json
    method: POST
    body:
      bucketId: "{{ garage_bucket_details.json.id }}"
      accessKeyId: "{{ garage_key_details.json.accessKeyId }}"
      permissions:
        read: "{{ 'read' in bucket.access }}"
        write: "{{ 'write' in bucket.access }}"
        owner: "{{ 'owner' in bucket.access }}"
    body_format: json
  when: ('read' in bucket.access) or ('write' in bucket.access) or ('owner' in bucket.access)
  changed_when: true

- name: Revoke undefined key access to bucket
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ garage_admin_api_port }}/v2/DenyBucketKey"
    return_content: true
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
      Content-Type: application/json
    method: POST
    body:
      bucketId: "{{ garage_bucket_details.json.id }}"
      accessKeyId: "{{ garage_key_details.json.accessKeyId }}"
      permissions:
        read: "{{ 'read' not in bucket.access }}"
        write: "{{ 'write' not in bucket.access }}"
        owner: "{{ 'owner' not in bucket.access }}"
    body_format: json
  when: ('read' not in bucket.access) or ('write' not in bucket.access) or ('owner' not in bucket.access)
  changed_when: true
