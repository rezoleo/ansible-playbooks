- name: Retrieve Garage secrets from Vault
  community.hashi_vault.vault_kv2_get:
    path: "{{ garage_vault_path }}"
  register:
    garage_rpc_secret: _task.result.secret.rpc_secret
    garage_admin_token: _task.result.secret.admin_token
  run_once: true
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Retrieve Garage metric secret from Vault
  community.hashi_vault.vault_kv2_get:
    path: "{{ garage_vault_metrics_path }}"
  register:
    garage_metrics_token: _task.result.secret.metrics_token
  run_once: true
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Get version installed on the host
  ansible.builtin.command: "{{ garage_binary }} --version"
  register:
    garage_installed_version: _task.result.stdout | default('') | regex_search('v[0-9]+[.][0-9]+[.][0-9]+[^ ]*')
  changed_when: false
  # We expect a failure on first run, so we use false for failed_when
  failed_when: false
  check_mode: false

- name: Install Garage
  ansible.builtin.include_tasks:
    file: install_garage.yaml
  when: garage_installed_version is none

- name: Update Garage
  ansible.builtin.include_tasks:
    file: update_garage.yaml
  when: garage_installed_version is not none and garage_installed_version is version(garage_version, '<')

- name: Configure Garage
  ansible.builtin.include_tasks:
    file: configure_garage.yaml

- name: Add firewall rules for Garage
  ansible.builtin.import_role:
    name: firewall
    tasks_from: create_rule.yml
  vars:
    firewall_rules:
      050-equestria:
        - rule_name: "Allow traffic from Equestria to port 3000"
          chain: INPUT
          protocol: tcp
          source: 10.12.2.2/32 # TODO: Source IP should depend on the inventory
          destination_port: 3900
          target: ACCEPT
