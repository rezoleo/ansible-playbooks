---
# We load the file where Garage expects it (it also enforced in the .service file)
- name: Import Garage config
  ansible.builtin.template:
    src: garage.toml.j2
    dest: /etc/garage.toml
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
    mode: "0600"
  become: true
  notify: Restart garage

- name: Create Garage systemd service file
  ansible.builtin.template:
    src: garage.service.j2
    dest: /etc/systemd/system/garage.service
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: Restart garage

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
