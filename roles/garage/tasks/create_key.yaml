- name: Retrieve Garage key from Vault
  community.hashi_vault.vault_kv2_get:
    path: "{{ garage_vault_keys_path }}/{{ key.name }}"
  register:
    garage_key_id: _task.result.secret.id | default('')
    garage_key_secret: _task.result.secret.secret | default('')
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  failed_when: >-
    _task.result.failed | default(false) and not ((_task.result.msg | default('') | lower) is search('missing path'))

- name: Get key current details
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ garage_admin_api_port }}/v2/GetKeyInfo?id={{ garage_key_id }}&showSecretKey=true"
    return_content: true
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
    status_code:
      - 200
      - 404
  register: garage_key_details
  when: garage_key_id | length > 0
  no_log: true

- name: Create Garage key
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ garage_admin_api_port }}/v2/CreateKey"
    return_content: true
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
      Content-Type: application/json
    method: POST
    body:
      name: "{{ key.name }}"
    body_format: json
  register: garage_key_details_new
  when: garage_key_id | length == 0 or garage_key_details.status == 404
  changed_when: true
  no_log: true

- name: Choose what details to use
  ansible.builtin.set_fact:
    garage_key_details: "{{ garage_key_details_new if (garage_key_id | length == 0 or garage_key_details.status == 404) else garage_key_details }}"
  no_log: true

- name: Save Garage key in Vault
  community.hashi_vault.vault_kv2_write:
    path: "{{ garage_vault_keys_path }}/{{ key.name }}"
    data:
      id: "{{ garage_key_details.json.accessKeyId }}"
      secret: "{{ garage_key_details.json.secretAccessKey }}"
  when: garage_key_id != garage_key_details.json.accessKeyId or garage_key_secret != garage_key_details.json.secretAccessKey
  delegate_to: localhost
  become: false
  no_log: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Allow Access to buckets
  loop: "{{ key.buckets | default([]) }}"
  loop_control:
    label: "{{ bucket.name }}"
    loop_var: bucket
  ansible.builtin.include_tasks: grant_key_access.yaml
  when: key.buckets is defined and key.buckets | length > 0
