- name: Download Garage
  ansible.builtin.get_url:
    url: "https://garagehq.deuxfleurs.fr/_releases/{{ garage_version }}/{{ garage_architecture }}-unknown-linux-musl/garage"
    dest: "{{ garage_binary }}"
    mode: '0711'
    owner: root
    group: root
    force: true
  notify: Restart garage
  become: true
  when: garage_installed_version != garage_version

- name: Create garage group
  ansible.builtin.group:
    name: "{{ garage_group }}"
    state: present
    system: true
  become: true

- name: Create Garage User
  ansible.builtin.user:
    name: "{{ garage_user }}"
    group: "{{ garage_group }}"
    system: true
    state: present
  become: true

- name: Create Garage directories
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    mode: "0700"
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
  loop:
    - "{{ garage_metadata_directory }}"
    - "{{ garage_data_directory }}"
    - "{{ garage_metadata_snapshot_directory }}"
  become: true
