---
- name: Retrieve from Vault the app password of {{ stalwart_app_password_name }}
  community.hashi_vault.vault_kv2_get:
    path: "{{ stalwart_app_password_vault_path }}/{{ stalwart_app_password_name }}"
  register: stalwart_app_password_vault_secret
  failed_when: stalwart_app_password_vault_secret.msg is defined and 'Invalid or missing path' not in stalwart_app_password_vault_secret.msg
  delegate_to: localhost
  become: false
  no_log: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Create the app password of {{ stalwart_app_password_name }}
  when: stalwart_app_password_vault_secret.secret is not defined
  delegate_to: "{{ stalwart_app_password_server }}"
  block:
    - name: Retrieve the API key of the mail server from Vault
      community.hashi_vault.vault_kv2_get:
        path: "{{ stalwart_app_password_api_key_vault_path }}"
      register: stalwart_app_password_api_key_secret # Not a projection: those are evaluated even when the task is skipped
      delegate_to: localhost
      become: false
      no_log: true
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Find the id of the account
      ansible.builtin.command:
        argv: [stalwart-cli, --url, "{{ stalwart_app_password_api_url }}", query, Account]
      environment:
        STALWART_TOKEN: "{{ stalwart_app_password_api_key_secret.secret.api_key }}"
      register: stalwart_app_password_accounts
      changed_when: false

    - name: Create the app password
      ansible.builtin.uri:
        url: "{{ stalwart_app_password_api_url }}/jmap"
        method: POST
        headers:
          Authorization: Bearer {{ stalwart_app_password_api_key_secret.secret.api_key }}
        body_format: json
        body:
          using: ["urn:ietf:params:jmap:core", "urn:stalwart:jmap"]
          methodCalls:
            - - x:AppPassword/set
              - accountId: "{{ stalwart_app_password_accounts.stdout | regex_search('(?m)^\\S+(?=\\s+' ~ stalwart_app_password_account | regex_escape ~ ')') }}"
                create: {new: {description: "{{ stalwart_app_password_name }}", allowedIps: "{{ {stalwart_app_password_ip: true} }}"}} # Keys are not templated
              - "0"
      register: stalwart_app_password_created
      failed_when: stalwart_app_password_created.json.methodResponses[0][1].created is not defined
      no_log: true

    - name: Store the app password in Vault
      community.hashi_vault.vault_kv2_write:
        path: "{{ stalwart_app_password_vault_path }}/{{ stalwart_app_password_name }}"
        data:
          password: "{{ stalwart_app_password_created.json.methodResponses[0][1].created.new.secret }}"
          allowed_ip: "{{ stalwart_app_password_ip }}"
      delegate_to: localhost
      become: false
      no_log: true
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Remember the app password of {{ stalwart_app_password_name }}
  ansible.builtin.set_fact:
    stalwart_app_password_secret: >-
      {{ stalwart_app_password_vault_secret.secret.password if stalwart_app_password_vault_secret.secret is defined
      else stalwart_app_password_created.json.methodResponses[0][1].created.new.secret }}
  no_log: true
