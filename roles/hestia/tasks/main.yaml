### BentoPDF ###

- name: Create bentokae directory
  ansible.builtin.file:
    path: /home/podman/bentokae
    state: directory
    owner: podman
    group: podman
    mode: "0755"

- name: Copy compose file for bentopdf
  ansible.builtin.copy:
    src: bentokae/compose.yml
    dest: /home/podman/bentokae/compose.yml
    owner: podman
    group: podman
    mode: "0644"

### Index ###

- name: Create index directory
  ansible.builtin.file:
    path: /home/podman/index
    state: directory
    owner: podman
    group: podman
    mode: "0755"

- name: Create gethomepage config directory
  ansible.builtin.copy:
    src: index/config/
    dest: /home/podman/index/config
    owner: podman
    group: podman
    mode: "0755"

- name: Create gethomepage icons directory
  ansible.builtin.copy:
    src: index/icons/
    dest: /home/podman/index/icons
    owner: podman
    group: podman
    mode: "0755"

- name: Copy compose file for index
  ansible.builtin.copy:
    src: index/compose.yml
    dest: /home/podman/index/compose.yml
    owner: podman
    group: podman
    mode: "0644"

#### Paperless ####

- name: Retrieve Paperless secrets from Vault
  community.hashi_vault.vault_kv2_get:
    path: services/paperless
  register: hestia_paperless_vault_secrets
  run_once: true
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Retrieve db secrets from Vault
  community.hashi_vault.vault_kv2_get:
    path: databases/paperless@pg.rezoleo.fr
  register: hestia_paperless_db_secret
  run_once: true
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"


- name: Set Paperless secrets to facts
  ansible.builtin.set_fact:
    hestia_paperless_secret_key: "{{ hestia_paperless_vault_secrets.secret.paperless_default_key }}"
    hestia_paperless_db_password: "{{ hestia_paperless_db_secret.secret.paperless }}"
    hestia_paperless_superadmin_password: "{{ hestia_paperless_vault_secrets.secret.rezoleo }}"
    hestia_paperless_sso_client_id: "{{ hestia_paperless_vault_secrets.secret.sso_id }}"
    hestia_paperless_sso_client_secret: "{{ hestia_paperless_vault_secrets.secret.sso_secret }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Create paperless directory
  ansible.builtin.file:
    path: /home/podman/paperless
    state: directory
    owner: podman
    group: podman
    mode: "0755"

- name: Copy compose file for paperless
  ansible.builtin.copy:
    src: paperless/compose.yml
    dest: /home/podman/paperless/compose.yml
    owner: podman
    group: podman
    mode: "0644"

- name: Copy and fill .env file for paperless
  ansible.builtin.template:
    src: paperless.env.j2
    dest: /home/podman/paperless/paperless.env
    owner: podman
    group: podman
    mode: "0600"

- name: Create paperless export directory
  ansible.builtin.file:
    path: /home/podman/paperless/export
    state: directory
    owner: podman
    group: podman
    mode: "0755"

##### Start services #####

- name: Start index
  ansible.builtin.command:
    cmd: podman-compose up -d
    chdir: /home/podman/index
  become: true
  become_user: podman
  changed_when: true

- name: Start bentopdf
  ansible.builtin.command:
    cmd: podman-compose up -d
    chdir: /home/podman/bentokae
  become: true
  become_user: podman
  changed_when: true

- name: Start paperless
  ansible.builtin.command:
    cmd: podman-compose up -d
    chdir: /home/podman/paperless
  become: true
  become_user: podman
  changed_when: true

- name: Add firewall rules for Hestia services
  ansible.builtin.import_role:
    name: firewall
    tasks_from: create_rule.yml
  vars:
    firewall_rules:
      050-equestria:
        - rule_name: "Allow traffic from Equestria to port 3000"
          chain: INPUT
          protocol: tcp
          source: 192.168.122.1/32
          destination_port: 3000
          target: ACCEPT
        - rule_name: "Allow traffic from Equestria to port 3001"
          chain: INPUT
          protocol: tcp
          source: 192.168.122.1/32
          destination_port: 3001
          target: ACCEPT
        - rule_name: "Allow traffic from Equestria to port 3002"
          chain: INPUT
          protocol: tcp
          source: 192.168.122.1/32
          destination_port: 3002
          target: ACCEPT
