---

- name: Restart Netbox
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: restarted
    daemon_reload: true
  loop:
    - netbox
    - netbox-rq
  become: true

- name: Restart nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
  become: true
