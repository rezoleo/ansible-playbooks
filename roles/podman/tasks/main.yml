- name: Installing podman
  ansible.builtin.apt:
    update_cache: true
    name:
      - podman
      - podman-compose
      - uidmap
    state: present

- name: Create podman group
  ansible.builtin.group:
    name: "podman"
    system: true

- name: Add ansible user to podman group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: "podman"
    append: true

- name: Create podman user
  ansible.builtin.user:
    name: "podman"
    group: "podman"
    system: true
    create_home: true

- name: Add podman user to systemd-journal group
  ansible.builtin.user:
    name: "podman"
    groups: systemd-journal
    append: true


- name: Add podman user to subuid file
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: "^podman:.*"
    line: "podman:10000:55536"
    create: true
    mode: '0644'
    owner: root
    group: root

- name: Add podman group to subgid file
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: "^podman:.*"
    line: "podman:10000:55536"
    create: true
    mode: '0644'
    owner: root
    group: root

- name: Enable lingering for podman user
  ansible.builtin.command:
    cmd: "loginctl enable-linger podman"
    creates: "/var/lib/systemd/linger/podman"

- name: Enable rootless mode for podman
  ansible.builtin.command:
    cmd: podman system migrate
  become: true
  become_user: podman
  changed_when: true
