- name: Install chrony package
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
  become: true

- name: Remove systemd-timesyncd
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: absent
    update-cache: true
  become: true

- name: Configure chrony server
  ansible.builtin.copy:
    src: chrony.conf
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: Restart chrony

- name: Vérifier la synchronisation du serveur Chrony
  ansible.builtin.shell: |
    sources=$(chronyc -n sources) || exit 3
    awk '$1 == "^*" && $5+0 > 0 {ok=1} END {exit !ok}' <<< "$sources" || exit 1
    tracking=$(chronyc tracking) || exit 3
    grep -Eq '^Leap status[[:space:]]*:[[:space:]]*Normal[[:space:]]*$' <<< "$tracking" || exit 2
    exit 0
  changed_when: false
  retries: 2
  delay: 5
  until: _task.result.rc == 0
  args:
    executable: /usr/bin/bash
