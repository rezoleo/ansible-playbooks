- name: Install chrony package
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
  become: true

- name: Remove systemd-timesyncd
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: absent
    update-cache: true
  become: true

- name: Configure chrony server
  ansible.builtin.copy:
    src: chrony.conf
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: Restart chrony

- name: Vérifier la synchronisation du serveur Chrony
  ansible.builtin.shell: |
    set -o pipefail
    chronyc -n sources | awk '$1 == "^*" && $5+0 > 0 {ok=1} END {exit ok ? 0 : 1}' &&
    chronyc tracking | awk -F: '/^Leap status[[:space:]]*:/ {if ($2 ~ /^[[:space:]]*Normal[[:space:]]*$/) ok=1} END {exit ok ? 0 : 2}'
  register: ntp_server_chrony_check
  changed_when: false
  failed_when: false
  retries: 2
  delay: 5
  until: ntp_server_chrony_check.rc == 0
  args:
    executable: /usr/bin/bash

- name: Valider la synchronisation du serveur Chrony
  ansible.builtin.assert:
    that:
      - ntp_server_chrony_check_rc == 0
    success_msg: "Le serveur Chrony est synchronisé."
    fail_msg: >-
      {{
        'Aucune source NTP marquée ^* avec Reach > 0.' if ntp_server_chrony_check.rc == 1
        else
          'Leap status différent de Normal.' if ntp_server_chrony_check.rc == 2
          else
            'Erreur inattendue pendant la vérification Chrony.'
      }}
