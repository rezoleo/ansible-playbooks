[project]
name = "ansible-playbooks"
description = "Rézoléo Ansible Playbooks"
version = "0.1.0"
requires-python = ">=3.13, <4"
dependencies = [
    "ansible==14.5.0",
    "hvac==2.4.0",
    "pysnmp==7.1.30",
    "lolcat==1.4",
    "pyfiglet==1.0.4",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "ansible-lint==26.10.1",
    "pre-commit==4.7.0",
    "ruff==0.17.3",
    "ty==0.0.95",
]

[tool.setuptools]
packages = []
