repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: ty-check
        name: Ty check
        entry: .venv/bin/ty check
        language: system
        types: [python]
      - id: ansible-lint
        name: Ansible lint
        entry: .venv/bin/ansible-lint
        language: system
        types: [yaml]
        exclude: ^\.github/workflows/
