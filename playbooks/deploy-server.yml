---
- name: Deploy a new server
  hosts: all
  roles:
    - common
    - monitoring # firewall will be installed alongside (dependency)
    - role: ntp
      when: ansible_facts['virtualization_type'] != "lxc"
    - ssh
    # - podman
    # - hestia

  post_tasks:
    - name: Run vault_agent
      ansible.builtin.import_role:
        name: vault_agent
        tasks_from: post_tasks.yml

- name: Deploy DNS resolver
  hosts: dns_resolvers
  roles:
    - knot_resolver

- name: Deploy UPS monitoring
  hosts: ups
  become: true
  roles:
    - nut
