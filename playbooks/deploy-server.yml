---
- name: Deploy a new server
  hosts: all
  roles:
    - common
    - monitoring # firewall will be installed alongside (dependency)
    - role: ntp
      when: ansible_facts['virtualization_type'] != "lxc"
    - ssh
    # - podman
    # - hestia

- name: Deploy DNS resolver
  hosts: dns_resolvers
  become: true
  vars:
    keepalived_check_script: |
        #!/bin/sh
        dig @{{ ansible_host }} . NS > /dev/null 2>&1
  roles:
    - knot_resolver
    - keepalived

- name: Deploy UPS monitoring
  hosts: ups
  become: true
  roles:
    - nut
