---
- name: Deploy a new server
  hosts: all
  roles:
    - common
    - monitoring # firewall will be installed alongside (dependency)
    - role: ntp
      when: ansible_facts['virtualization_type'] != "lxc"
    - ssh
    # - podman
    # - hestia

- name: Deploy DNS resolver
  hosts: dns_resolvers
  roles:
    - knot_resolver

- name: Deploy UPS monitoring
  hosts: ups
  become: true
  roles:
    - nut

- name: Deploy mail server
  hosts: mail
  become: true
  roles:
    - role: stalwart
      tags: [stalwart]

- name: Relay local mail through the mail server
  hosts: all:!mail
  become: true
  roles:
    - role: mail_relay
      tags: [mail_relay]
