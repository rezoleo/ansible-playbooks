---
- name: Deploy a new server
  hosts: all
  roles:
    - common
    - firewall
    - monitoring # note that firewall is a dependency
    - ssh

- name: Install ntp client
  hosts: all:!ntp_server
  roles:
    - role: ntp
      when: ansible_facts['virtualization_type'] != "lxc"

- name: Install NTP server
  hosts:
    - ntp_server
  roles:
    - ntp_server

- name: Install podman
  hosts:
    - podman_vm
    - hestia
  roles:
    - podman

- name: Deploy Hestia
  hosts: hestia
  roles:
    - hestia

- name: Deploy DNS resolver
  hosts: dns_resolvers
  roles:
    - knot_resolver

- name: Deploy UPS monitoring
  hosts: ups
  become: true
  roles:
    - nut
